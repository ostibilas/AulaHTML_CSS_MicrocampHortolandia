<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Aula Simples de CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Background-color -->
    <div class="fundo">Cor de fundo (background-color)</div>

    <!-- 2. Três tipos de Border -->
    <div class="borda-1">Borda Sólida</div>
    <div class="borda-2">Borda Tracejada</div>
    <div class="borda-3">Borda Pontilhada</div>

    <!-- 3. Cor do texto, Negrito e Riscado -->
    <p class="cor-texto">Texto colorido</p>
    <p class="negrito">Texto em negrito</p>
    <p class="riscado">Texto riscado</p>

    <!-- 4. Fontes diferentes -->
    <p>Texto normal e <span class="outra-fonte">texto com fonte diferente</span>.</p>

    <!-- 5. Alinhamentos -->
    <p class="esquerda">Texto à esquerda (padrão)</p>
    <p class="centro">Texto no centro</p>
    <p class="direita">Texto à direita</p>

</body>
</html>
